[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nepal-hydro"
dynamic = ["version"]
description = "WECS/DHM (1990) and MIP (1982) hydrology for ungauged rivers in Nepal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Anish Bhattarai" }]
keywords = ["hydrology", "nepal", "hydropower", "micro-hydro", "flood", "flow-duration-curve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.8",
    "numpy",  # tests only: numpy scalars as inputs
]

[project.scripts]
nepal-hydro = "nepal_hydro.cli:main"

[tool.hatch.version]
path = "src/nepal_hydro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nepal_hydro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nepal_hydro"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
