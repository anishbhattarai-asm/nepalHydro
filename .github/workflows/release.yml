name: Release

# Publishes to PyPI through Trusted Publishing (no API token) when a tag like
# v0.1.0 or v0.1.0a1 is pushed. The tag must match __version__ in
# src/nepal_hydro/__init__.py (compared as PEP 440 versions; see scripts/check_tag_version.py).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version (PEP 440, pre-releases allowed)
        run: |
          python -m pip install packaging
          python scripts/check_tag_version.py "$GITHUB_REF_NAME"
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Checks
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest --cov --cov-fail-under=95
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the distributions
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nepal-hydro/
    permissions:
      id-token: write  # Trusted Publishing: the OIDC token is the only credential
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
