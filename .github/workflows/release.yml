name: Release

# Publishes to PyPI through Trusted Publishing (no API token) when a tag like
# v0.1.0 is pushed. The tag must match __version__ in src/nepal_hydro/__init__.py.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('src/nepal_hydro/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "tag: $tag   __version__: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match __version__ = $version"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Checks
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest --cov --cov-fail-under=95
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the distributions
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nepal-hydro/
    permissions:
      id-token: write  # Trusted Publishing: the OIDC token is the only credential
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
